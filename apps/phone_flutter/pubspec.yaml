environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  flutter_secure_storage: ^10.3.1
  url_launcher: ^6.3.2
  ward_pulse_bindings:
