name: Android Debug Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apks:
    name: Build and verify debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: >-
            platforms;android-35 platforms;android-36 platforms;android-37.1
            build-tools;36.0.0 ndk;28.2.13676358 ndk;29.0.14206865 cmake;3.22.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Provision the host debug keystore
        env:
          WARDPULSE_DEBUG_KEYSTORE_B64: ${{ secrets.WARDPULSE_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          debug_keystore="$HOME/.android/debug.keystore"
          # Phone, Wear and WFF must all sign with this one job-local identity.
          if [[ -e "$debug_keystore" || -L "$debug_keystore" ]]; then
            echo 'This runner already has an Android debug keystore; refusing to reuse it.'
            exit 1
          fi
          # From here on this run owns the keystore, whether imported or created by AGP.
          echo 'WARDPULSE_OWNS_DEBUG_KEYSTORE=true' >> "$GITHUB_ENV"
          # AGP creates the default key in a later step; keep its directory owner-only.
          mkdir -p "$HOME/.android"
          chmod 700 "$HOME/.android"
          if [[ -z "$WARDPULSE_DEBUG_KEYSTORE_B64" ]]; then
            echo 'No WARDPULSE_DEBUG_KEYSTORE_B64: AGP creates a temporary debug keystore for this run.'
            exit 0
          fi
          if ! printf '%s' "$WARDPULSE_DEBUG_KEYSTORE_B64" | base64 --decode > "$debug_keystore" 2>/dev/null ||
            ! keytool -list -keystore "$debug_keystore" -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            rm -f -- "$debug_keystore"
            echo 'WARDPULSE_DEBUG_KEYSTORE_B64 must hold a keystore with alias androiddebugkey and password android.'
            exit 1
          fi
          echo 'Using the persistent debug keystore from WARDPULSE_DEBUG_KEYSTORE_B64.'

      - name: Provision temporary Push development signing
        run: |
          set -euo pipefail
          umask 077
          test ! -e watchface-push-debug.properties
          test ! -L watchface-push-debug.properties
          push_key_dir=$(mktemp -d "$RUNNER_TEMP/wardpulse-push-signing.XXXXXX")
          {
            echo 'WARDPULSE_OWNS_PUSH_PROPERTIES=true'
            printf 'WARDPULSE_PUSH_KEY_DIR=%s\n' "$push_key_dir"
          } >> "$GITHUB_ENV"
          push_store_password=$(openssl rand -hex 32)
          push_key_password=$(openssl rand -hex 32)
          echo "::add-mask::$push_store_password"
          echo "::add-mask::$push_key_password"
          export WARDPULSE_PUSH_STORE_PASSWORD="$push_store_password"
          export WARDPULSE_PUSH_KEY_PASSWORD="$push_key_password"
          keytool -genkeypair -noprompt -storetype JKS \
            -keystore "$push_key_dir/development.jks" \
            -storepass:env WARDPULSE_PUSH_STORE_PASSWORD \
            -keypass:env WARDPULSE_PUSH_KEY_PASSWORD \
            -alias wardpulse-push-development -keyalg RSA -keysize 2048 \
            -validity 3650 -dname "CN=WardPulse Debug Build Push Development" \
            >/dev/null 2>&1
          {
            printf 'storeFile=%s\n' "$push_key_dir/development.jks"
            printf 'storePassword=%s\n' "$push_store_password"
            printf 'keyAlias=%s\n' 'wardpulse-push-development'
            printf 'keyPassword=%s\n' "$push_key_password"
          } > watchface-push-debug.properties

      - name: Build the phone debug APK
        run: |
          set -euo pipefail
          tools/build-android-rust/build.sh
          cd apps/phone_flutter
          flutter pub get --enforce-lockfile
          flutter build apk --debug --target-platform android-arm64,android-x64

      - name: Build the Wear debug APK
        working-directory: apps/wear_android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Build the legacy watch face debug APK
        working-directory: apps/watchface_wff
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify signatures and stage the debug APKs
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          stage="$RUNNER_TEMP/wardpulse-debug-apks"
          mkdir -m 700 "$stage"
          # The shared host signer must be the debug keystore at the ordinary location.
          host_signer=$(keytool -exportcert -alias androiddebugkey -storepass android \
            -keystore "$HOME/.android/debug.keystore" | sha256sum | cut -d ' ' -f 1)

          phone_apk=apps/phone_flutter/build/app/outputs/flutter-apk/app-debug.apk
          phone_entries=$(unzip -Z1 "$phone_apk")
          for abi in arm64-v8a x86_64; do
            if ! grep -Fqx "lib/$abi/libward_pulse_ffi.so" <<< "$phone_entries"; then
              echo "The phone APK lacks the $abi Rust FFI library."
              exit 1
            fi
          done

          stage_apk() {
            local certificates signers
            certificates=$("$apksigner" verify --verbose --print-certs "$1")
            signers=$(sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: \([0-9a-f]\{64\}\)$/\1/p' <<< "$certificates")
            if ! grep -qx 'Verifies' <<< "$certificates" || [[ "$signers" != "$host_signer" ]]; then
              echo "$2 is not signed only by the shared host debug certificate."
              exit 1
            fi
            cp -- "$1" "$stage/$2"
          }
          stage_apk "$phone_apk" WardPulse-Debug-Android.apk
          stage_apk apps/wear_android/app/build/outputs/apk/debug/app-debug.apk WardPulse-Debug-WearOS.apk
          stage_apk apps/watchface_wff/build/outputs/apk/debug/WardPulseWatchFace-debug.apk \
            WardPulse-Debug-WatchFace-WearOS5Plus.apk
          echo "Three debug APKs share the host signer SHA-256 $host_signer."

      - name: Remove workflow-created signing material
        if: ${{ always() }}
        run: |
          # Remove only paths that this run's provisioning steps claimed.
          if [[ "${WARDPULSE_OWNS_DEBUG_KEYSTORE:-}" == true ]]; then
            rm -f -- "$HOME/.android/debug.keystore"
          fi
          if [[ "${WARDPULSE_OWNS_PUSH_PROPERTIES:-}" == true ]]; then
            rm -f -- "$GITHUB_WORKSPACE/watchface-push-debug.properties"
          fi
          if [[ -n "${WARDPULSE_PUSH_KEY_DIR:-}" ]]; then
            rm -rf -- "$WARDPULSE_PUSH_KEY_DIR"
          fi

      - name: Upload the debug APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WardPulse-Debug-APKs
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          path: |
            ${{ runner.temp }}/wardpulse-debug-apks/WardPulse-Debug-Android.apk
            ${{ runner.temp }}/wardpulse-debug-apks/WardPulse-Debug-WearOS.apk
            ${{ runner.temp }}/wardpulse-debug-apks/WardPulse-Debug-WatchFace-WearOS5Plus.apk
