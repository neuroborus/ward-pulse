name: Docs

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "apps/**/README.md"
      - "bindings/**/README.md"
      - ".npmrc"
      - ".nvmrc"
      - "package.json"
      - "package-lock.json"
      - "tools/check-doc-citations.py"
      - "tools/test-doc-citations.py"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions: {}

jobs:
  docs:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python3 tools/check-doc-citations.py
      - run: python3 tools/test-doc-citations.py
      - run: WARDPULSE_DOCS_BASE_PATH=/ward-pulse npm run docs:build
      - uses: actions/upload-pages-artifact@v5.0.0
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          path: docs/site/dist/public

  deploy:
    name: Deploy
    needs: docs
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
