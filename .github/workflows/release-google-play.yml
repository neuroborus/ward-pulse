name: Google Play Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Explicit stable tag of a published GitHub release
        required: true
        type: string
      phone-track:
        description: Existing mobile track ID from Play tracks.list
        required: true
        default: qa
        type: string
      wear-track:
        description: Existing Wear track ID from Play tracks.list
        required: true
        default: wear:qa
        type: string
      status:
        description: Requested Play release status (completed does not establish delivery)
        required: true
        default: draft
        type: choice
        options:
          - draft
          - completed

permissions:
  contents: read

concurrency:
  group: google-play-release
  cancel-in-progress: false

jobs:
  release:
    name: Prepare and apply published phone and Wear bundles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: google-play
    defaults:
      run:
        shell: bash
    steps:
      - name: Require the original main dispatch
        timeout-minutes: 1
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare the published GitHub release before Google authentication
        id: prepare
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          umask 077
          parent="$(mktemp -d "$RUNNER_TEMP/wardpulse-play.XXXXXX")"
          preparation="$parent/prepared"
          python3 tools/release-google-play/release_google_play.py \
            --tag="$RELEASE_TAG" --output="$preparation"
          printf 'preparation=%s\n' "$preparation" >> "$GITHUB_OUTPUT"

      - name: Obtain an androidpublisher-only access token
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        timeout-minutes: 2
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false

      - name: Apply the exact verified bundles in one Play edit
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PREPARATION: ${{ steps.prepare.outputs.preparation }}
          PHONE_TRACK: ${{ inputs.phone-track }}
          WEAR_TRACK: ${{ inputs.wear-track }}
          RELEASE_STATUS: ${{ inputs.status }}
        run: |
          set -euo pipefail
          python3 tools/release-google-play/release_google_play.py apply \
            --preparation="$PREPARATION" --phone-track="$PHONE_TRACK" \
            --wear-track="$WEAR_TRACK" --status="$RELEASE_STATUS"
